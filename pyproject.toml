[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hearthline-biohub-station"
version = "0.0.0"
description = "Preparation-only tools for the Hearthline Biohub cell-tracking title"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "CC-BY-4.0" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
