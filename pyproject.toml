[project]
name = "hearthline-rosetta-station"
version = "0.0.0"
description = "Preparation-only controls for the Hearthline RosettaBench title"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "CC-BY-4.0" }
dependencies = []

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF"]
