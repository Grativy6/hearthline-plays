name: ARC-AGI-3 public orientation probe

on:
  push:
    branches:
      - arc-agi/titles/arc-agi-3-hearthline-launch-20260903
    paths:
      - "practice/requests/ORIENT-*.json"

permissions:
  contents: read

concurrency:
  group: arc3-public-orientation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned official public toolkit
        run: python -m pip install --disable-pip-version-check "git+https://github.com/arcprize/ARC-AGI.git@f12822c4d550121c35a275008d964afbbed47d2f"
      - name: Select newest immutable request
        id: request
        shell: bash
        run: |
          request="$(find practice/requests -maxdepth 1 -type f -name 'ORIENT-*.json' | sort | tail -n 1)"
          test -n "$request"
          echo "path=$request" >> "$GITHUB_OUTPUT"
          echo "Selected $request"
      - name: Replay explicit public request
        run: |
          python -B tools/arc3_replay_probe.py \
            --request "${{ steps.request.outputs.path }}" \
            --out run-artifact
      - name: Upload exact request, frames, and receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arc3-public-orientation-${{ github.sha }}
          path: run-artifact/
          if-no-files-found: error
          retention-days: 30
